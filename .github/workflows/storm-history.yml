name: Storm history (June-July wind by marine forecast area)

on:
  workflow_dispatch:
    inputs:
      from_run:
        description: "Reuse the fetched records of this earlier run (its id) instead of fetching again"
        default: ""
  push:
    paths:
      - "scripts/storm_history.py"
      - ".github/workflows/storm-history.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: storm-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    # skipped for a dispatch reusing an earlier run, or a push whose message says [no fetch] (the history job then uses the committed caches)
    if: ${{ !inputs.from_run && !contains(github.event.head_commit.message, '[no fetch]') }}
    # one runner per ERA5 sample point (Open-Meteo throttles a single address) and per area's observed record
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        arg: ["--only 0", "--only 1", "--only 2", "--only 3", "--only 4", "--only 5", "--only 6", "--only 7", "--only 8", "--only 9",
              "--only 10", "--only 11", "--only 12", "--only 13", "--only 14", "--only 15", "--only 16", "--only 17", "--only 18",
              "--obs 0", "--obs 1", "--obs 2", "--obs 3", "--obs 4", "--obs 5", "--obs 6", "--obs 7", "--obs 8", "--obs 9",
              "--obs 10", "--obs 11", "--obs 12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/storm_history.py ${{ matrix.arg }}
      - id: name
        run: echo "n=$(echo '${{ matrix.arg }}' | tr -d ' -')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ steps.name.outputs.n }}
          path: data/storm_history/parts/

  history:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: part-*
          path: data/storm_history/parts
          merge-multiple: true
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ github.token }}
      - run: python scripts/storm_history.py
      - name: Commit the history (also the merged caches if the run failed)
        if: always()
        run: |
          rm -rf data/storm_history/parts
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A data/storm_history
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update storm history"
          git pull --rebase -X theirs
          git push
