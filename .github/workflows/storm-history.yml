name: Storm history (June-July wind by marine forecast area)

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/storm_history.py"
      - ".github/workflows/storm-history.yml"

permissions:
  contents: write

concurrency:
  group: storm-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/storm_history.py
      - name: Commit the history (also the partial ERA5 cache if the run failed)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A data/storm_history
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update storm history"
          git pull --rebase
          git push
