name: Probe chart screenshots (temporary)
on:
  push:
    paths: [".github/workflows/probe-shot.yml", "probe/shot.mjs"]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd probe && npm init -y >/dev/null && npm i playwright@1.47.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cd .. && (python3 -m http.server 8765 >/dev/null 2>&1 &) && sleep 2
          node probe/shot.mjs || true
          rm -rf probe/node_modules probe/package*.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Probe chart screenshots" && git pull --rebase && git push
