name: Build tidal stream field (WebTide + SalishSeaCast)

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_stream_field.py"
      - ".github/workflows/stream-field.yml"

permissions:
  contents: write

concurrency:
  group: stream-field-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "8" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy scipy utide pillow
      - name: Install DFO WebTide and its Northeast Pacific data
        run: |
          mkdir -p /tmp/wt && cd /tmp/wt
          # DFO moved the Bedford Institute site from bio.gc.ca to bio-iob.gc.ca: try both, and failing that, the links on the
          # download pages
          P=science/research-recherche/ocean/webtide
          get() {   # get <file name> <path under InstData> <out>
            for h in www.bio-iob.gc.ca www.bio.gc.ca; do
              curl -sSfL -m 600 "https://$h/$P/Application/Install/InstData/$2" -o "$3" && return 0
            done
            for pg in download-telecharger-en.php nepacific-nepacifique-en.php; do
              for h in www.bio-iob.gc.ca www.bio.gc.ca; do
                u=$(curl -sSfL -m 60 "https://$h/$P/$pg" | grep -o "href=\"[^\"]*$1\"" | head -1 | cut -d'"' -f2) || true
                [ -n "$u" ] || continue
                case "$u" in http*) ;; /*) u="https://$h$u" ;; *) u="https://$h/$P/$u" ;; esac
                echo "trying $u"; curl -sSfL -m 600 "$u" -o "$3" && return 0
              done
            done
            echo "could not download $1"; return 1
          }
          get WebTide_unix_0_7_1.sh Linux/WebTide_unix_0_7_1.sh app.sh
          get WebTide_ne_pac_data_0_7.sh Data/Unix/WebTide_ne_pac_data_0_7.sh data.sh
          sh app.sh -q -dir /tmp/wt/inst
          sh data.sh -q -dir /tmp/wt/inst
          ls /tmp/wt/inst/data/ne_pac4
      - uses: actions/cache@v4
        with:
          path: dl/ssc
          key: ssc-${{ hashFiles('data/route.json') }}-${{ github.run_id }}
          restore-keys: ssc-
      - run: python scripts/build_stream_field.py /tmp/wt/inst/data/ne_pac4
      - name: Commit the stream field
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/stream_field.json data/stream_grid.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update tidal stream field"
          git pull --rebase
          git push
