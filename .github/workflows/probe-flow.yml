name: Probe current model sources (temporary)
on:
  push:
    paths: [".github/workflows/probe-flow.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe; rm -f probe/*
          W=https://www.bio.gc.ca/science/research-recherche/ocean/webtide
          for p in download-telecharger-en.php data-donnees-en.php nepacific-nepacifique-en.php; do curl -sSL -m 60 "$W/$p" -o probe/wt_$p.html || true; done
          E=https://salishsea.eos.ubc.ca/erddap
          curl -sS -m 300 "$E/griddap/ubcSSnBathymetryV21-08.nc?longitude[0:1:897][0:1:397],latitude[0:1:897][0:1:397],bathymetry[0:1:897][0:1:397]" -o probe/ssc_bathy.nc || true
          curl -sS -m 300 "$E/griddap/ubcSSg3DuGridFields1hV21-11.csv?uVelocity[(2024-06-01T00:30:00Z):1:(2024-06-01T05:30:00Z)][(0.5)][(500)][(200)]" -o probe/ssc_u_sample.csv || true
          ls -la probe
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A probe && git commit -m "Probe current model sources 2" && git pull --rebase && git push
