name: Probe current model sources (temporary)
on:
  push:
    paths: [".github/workflows/probe-flow.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          E=https://salishsea.eos.ubc.ca/erddap
          curl -sS -m 120 "$E/griddap/index.csv?page=1&itemsPerPage=1000" -o probe/ssc_griddap.csv || echo fail > probe/ssc_griddap.csv
          for id in ubcSSg3DuGridFields1hV21-11 ubcSSg3DvGridFields1hV21-11 ubcSSgSurfaceTracerFields1hV21-11; do
            curl -sS -m 120 "$E/info/$id/index.csv" -o probe/ssc_info_$id.csv || true
          done
          curl -sSL -m 120 "https://www.bio.gc.ca/science/research-recherche/ocean/webtide/index-en.php" -o probe/webtide.html || true
          curl -sSL -m 60 "https://dd.weather.gc.ca/model_ciops/west/" -o probe/ciops.html || true
          curl -sSL -m 60 "https://salishsea.eos.ubc.ca/erddap/files/" -o probe/ssc_files.html || true
          ls -la probe
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Probe current model sources" && git pull --rebase && git push
