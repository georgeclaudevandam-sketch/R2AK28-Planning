name: Probe current model sources (temporary)
on:
  push:
    paths: [".github/workflows/probe-flow.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "8" }
      - run: |
          mkdir -p probe; rm -f probe/*
          W=https://www.bio.gc.ca/science/research-recherche/ocean/webtide/Application/Install/InstData
          mkdir -p /tmp/wt && cd /tmp/wt
          curl -sSL -m 600 "$W/Data/Unix/WebTide_ne_pac_data_0_7.sh" -o data.sh 2> $GITHUB_WORKSPACE/probe/wt_curl.txt || true
          ls -la >> $GITHUB_WORKSPACE/probe/wt_log.txt
          (unzip -l data.sh 2>&1 | head -80) > $GITHUB_WORKSPACE/probe/wt_unzip.txt || true
          head -c 3000 data.sh | strings | head -60 > $GITHUB_WORKSPACE/probe/wt_head.txt || true
          export INSTALLER_UI=silent
          (timeout 600 sh data.sh -i silent -DUSER_INSTALL_DIR=/tmp/wt/inst 2>&1 | tail -30) >> $GITHUB_WORKSPACE/probe/wt_log.txt || true
          (find /tmp/wt -maxdepth 6 -type f -not -name data.sh | head -200; du -sh /tmp/wt/inst) >> $GITHUB_WORKSPACE/probe/wt_files.txt 2>&1 || true
          cd $GITHUB_WORKSPACE
          E=https://salishsea.eos.ubc.ca/erddap
          curl -sS -m 600 "$E/griddap/ubcSSg3DuGridFields1hV21-11.csv?uVelocity%5B(2024-06-01T00:30:00Z):1:(2024-06-01T05:30:00Z)%5D%5B(0.5000003)%5D%5B(500)%5D%5B(200)%5D" -o probe/ssc_u_sample.csv 2> probe/ssc_curl.txt || true
          curl -sS -m 600 "$E/griddap/ubcSSnBathymetryV21-08.csv?longitude%5B(400):1:(401)%5D%5B(200):1:(201)%5D,latitude%5B(400):1:(401)%5D%5B(200):1:(201)%5D" -o probe/ssc_grid_sample.csv 2>> probe/ssc_curl.txt || true
          ls -la probe
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A probe && git commit -m "Probe current model sources 3" && git pull --rebase && git push
