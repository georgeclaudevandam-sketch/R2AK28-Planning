name: Probe current model sources (temporary)
on:
  push:
    paths: [".github/workflows/probe-flow.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "8" }
      - run: |
          mkdir -p probe; rm -f probe/*
          W=https://www.bio.gc.ca/science/research-recherche/ocean/webtide/Application/Install/InstData
          mkdir -p /tmp/wt && cd /tmp/wt
          curl -sSL -m 600 "$W/Data/Unix/WebTide_ne_pac_data_0_7.sh" -o data.sh 2> $GITHUB_WORKSPACE/probe/wt_curl.txt || true
          ls -la >> $GITHUB_WORKSPACE/probe/wt_log.txt
          (unzip -l data.sh 2>&1 | head -80) > $GITHUB_WORKSPACE/probe/wt_unzip.txt || true
          head -c 3000 data.sh | strings | head -60 > $GITHUB_WORKSPACE/probe/wt_head.txt || true
          curl -sSL -m 600 "$W/Linux/WebTide_unix_0_7_1.sh" -o app.sh
          (timeout 900 sh app.sh -q -dir /tmp/wt/inst 2>&1 | tail -10) >> $GITHUB_WORKSPACE/probe/wt_log.txt || true
          (timeout 900 sh data.sh -q -dir /tmp/wt/inst 2>&1 | tail -30) >> $GITHUB_WORKSPACE/probe/wt_log.txt || true
          (find /tmp/wt/inst -type f | xargs ls -la; du -sh /tmp/wt/inst) > $GITHUB_WORKSPACE/probe/wt_files.txt 2>&1 || true
          mkdir -p $GITHUB_WORKSPACE/probe/webtide && cd /tmp/wt/inst && find . -type f -size -60M \( -path "*data*" -o -path "*Data*" \) -exec cp --parents {} $GITHUB_WORKSPACE/probe/webtide/ \; || true
          cd $GITHUB_WORKSPACE
          ls -la probe
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A probe && git commit -m "Probe current model sources 5" && git pull --rebase && git push
