name: Probe chart services
on:
  push:
    branches: [claude/project-thread-o3esgd]
    paths: [.github/workflows/probe-charts.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/project-thread-o3esgd }
      - run: |
          mkdir -p probe
          python3 - <<'PY'
          import math, urllib.request, urllib.parse, json
          CHS = "https://egisp.dfo-mpo.gc.ca/arcgis/rest/services/chs/ENC_MaritimeChartService/MapServer/exts/MaritimeChartService/MapServer"
          NOAA = "https://gis.charttools.noaa.gov/arcgis/rest/services/MCS/NOAAChartDisplay/MapServer/exts/MaritimeChartService/MapServer"
          def merc(lat, lon): return lon * 20037508.34 / 180, math.log(math.tan((90 + lat) * math.pi / 360)) * 20037508.34 / math.pi
          disp = json.dumps({"ECDISParameters": {"version": "10.9.1", "DynamicParameters": {"Parameter": [{"name": "HonorScamin", "value": 1}], "ParameterGroup": [
            {"name": "TextSize", "Parameter": [{"name": "scaleFactor", "value": 1.3}, {"name": "minZoom", "value": 1}, {"name": "maxZoom", "value": 1.2}]},
            {"name": "PointSymbolSize", "Parameter": [{"name": "scaleFactor", "value": 1.2}, {"name": "minZoom", "value": 1}, {"name": "maxZoom", "value": 1.2}]}]}}})
          for name, lat, lon in [("grenville", 53.62, -129.75), ("johnstone", 50.42, -125.95), ("bellabella", 52.16, -128.14), ("haro", 48.55, -123.2)]:
            for z in (10, 12, 13):
              x, y = merc(lat, lon); w = 40075016.68 / 2 ** z
              bbox = f"{x},{y},{x + w},{y + w}"
              for tag, svc, show in [("chs", CHS, "show:0,1,2,3,4,5,6,7,9,12"), ("noaa", NOAA, "show:0,1,2,3,4,5,6,7")]:
                for dtag, d in [("p", disp), ("n", None)]:
                  q = {"bbox": bbox, "bboxSR": "3857", "imageSR": "3857", "size": "512,512", "dpi": "192", "format": "png32", "transparent": "true", "layers": show, "f": "image"}
                  if d: q["display_params"] = d
                  try:
                    r = urllib.request.urlopen(svc + "/export?" + urllib.parse.urlencode(q), timeout=120).read()
                    open(f"probe/{name}-z{z}-{tag}-{dtag}.png", "wb").write(r); print(name, z, tag, dtag, len(r), r[:80] if not r.startswith(b"\x89PNG") else "")
                  except Exception as e: print(name, z, tag, dtag, "ERR", e)
          PY
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add probe; git commit -m "Chart probe images (temporary)" || true
          git pull --rebase origin claude/project-thread-o3esgd; git push origin HEAD:claude/project-thread-o3esgd
