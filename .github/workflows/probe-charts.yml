name: Probe chart services
on:
  push:
    branches: [claude/project-thread-o3esgd]
    paths: [.github/workflows/probe-charts.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/project-thread-o3esgd }
      - run: |
          mkdir -p probe
          python3 - <<'PY'
          import math, urllib.request, urllib.parse, json
          CHS = "https://egisp.dfo-mpo.gc.ca/arcgis/rest/services/chs/ENC_MaritimeChartService/MapServer/exts/MaritimeChartService/MapServer"
          NOAA = "https://gis.charttools.noaa.gov/arcgis/rest/services/MCS/NOAAChartDisplay/MapServer/exts/MaritimeChartService/MapServer"
          def merc(lat, lon): return lon * 20037508.34 / 180, math.log(math.tan((90 + lat) * math.pi / 360)) * 20037508.34 / math.pi
          def dp(params=(), groups=()):
            P = [{"name": n, "value": v} for n, v in params]
            G = [{"name": g, "Parameter": [{"name": k, "value": v} for k, v in kv]} for g, kv in groups]
            return json.dumps({"ECDISParameters": {"version": "10.9.1", "DynamicParameters": {"Parameter": P, "ParameterGroup": G}}})
          big = [("TextSize", [("scaleFactor", 1.3), ("minZoom", 1), ("maxZoom", 1.2)]), ("PointSymbolSize", [("scaleFactor", 1.2), ("minZoom", 1), ("maxZoom", 1.2)])]
          variants = [
            ("a-now", dp((), big), 96, 256),
            ("b-range002", dp((), big + [("DatasetDisplayRange", [("minZoom", 0.02), ("maxZoom", 1.2)])]), 96, 256),
            ("c-range002-noscamin", dp([("HonorScamin", 1)], big + [("DatasetDisplayRange", [("minZoom", 0.02), ("maxZoom", 1.2)])]), 96, 256),
            ("d-range002-hidpi", dp((), big + [("DatasetDisplayRange", [("minZoom", 0.02), ("maxZoom", 1.2)])]), 192, 512),
          ]
          for name, svc, lat, lon in [("chs-seymour", CHS, 50.13, -125.35), ("chs-nanaimo", CHS, 49.17, -123.93), ("noaa-ktn", NOAA, 55.33, -131.64)]:
            for z in (10, 12, 14):
              x, y = merc(lat, lon); w = 40075016.68 / 2 ** z
              bbox = f"{x},{y},{x + w},{y + w}"
              for tag, d, dpi, px in variants:
                q = {"bbox": bbox, "bboxSR": "3857", "imageSR": "3857", "size": f"{px},{px}", "dpi": str(dpi), "format": "png32", "transparent": "true", "layers": "show:0,1,2,3,4,5,6,7,9,10,12", "f": "image", "display_params": d}
                try:
                  r = urllib.request.urlopen(svc + "/export?" + urllib.parse.urlencode(q), timeout=120).read()
                  open(f"probe/{name}-z{z}-{tag}.png", "wb").write(r); print(name, z, tag, len(r))
                except Exception as e: print(name, z, tag, "ERR", e)
          PY
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add probe; git commit -m "Chart probe images (temporary)" || true
          git pull --rebase origin claude/project-thread-o3esgd; git push origin HEAD:claude/project-thread-o3esgd
