name: Probe chart services

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_enc_lights.py"
      - ".github/workflows/probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe_enc_lights.py
