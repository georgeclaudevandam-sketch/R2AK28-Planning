name: Probe Swiftsure tracker (temporary)
on:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe && cd probe
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          g() { curl -sSL --compressed -A "$UA" -D "$1.hdr" "$2" -o "$1" --max-time 60 || true; }
          g robots-legacy.txt "http://legacy.tracker.swiftsure.org/robots.txt"
          g robots-leg2.txt "http://leg2.r2ak.com/robots.txt"
          g legacy2017leg2.html "http://legacy.tracker.swiftsure.org/?token=0785d8103b089b62d1aa7707bfe7c0db"
          g leg2.html "http://leg2.r2ak.com/"
          g leg1.html "http://leg1.r2ak.com/"
          ls -la
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Probe Swiftsure output" && git pull --rebase && git push || true
