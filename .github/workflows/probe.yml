name: Probe MAProgress 2022 (temporary)
on:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe && cd probe && rm -f *
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          g() { curl -sSL --compressed -A "$UA" -e https://r2ak2022.maprogress.com/ -D "$1.hdr" "$2" -o "$1" || true; }
          g mapm.js "https://map0.b-cdn.net/js/mapm?id=2915&v=173&mv=0"
          g mapl.js "https://mpz.nz/js/mapl?i=2915&f=4&a=1657393200&v=226&l=0&m=0&z=1"
          g mapl0.js "https://mpz.nz/js/mapl?i=2915&f=4&a=0&v=226&l=0&m=0&z=1"
          g emap.js "https://map0.b-cdn.net/js/emap?v=rPQAxbztp91Oiw5QxzO-o7mztn8fVgY2nxWvrZtSItA1"
          g mapc.js "https://map0.b-cdn.net/js/mapc?v=tPRs-es-3hABQXcbpKVC-EvxBo0yEj59pf_6SCKqr-01"
          g maps.js "https://map0.b-cdn.net/js/maps?v=17.22.4"
          ls -la; head -c 3000 mapm.js; echo; head -c 3000 mapl.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Probe MAProgress output" && git push || true
