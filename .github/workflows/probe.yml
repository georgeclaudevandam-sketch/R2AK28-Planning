name: Probe MAProgress 2022 (temporary)
on:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe && cd probe
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          curl -sSL -A "$UA" -D page.hdr https://r2ak2022.maprogress.com/ -o page.html || true
          grep -oE '(src|href)="[^"]+\.js[^"]*"' page.html | sed -E 's/^(src|href)="//; s/"$//' | sort -u > scripts.txt || true
          i=0; while read -r u; do i=$((i+1)); case "$u" in http*) ;; //*) u="https:$u";; /*) u="https://r2ak2022.maprogress.com$u";; *) u="https://r2ak2022.maprogress.com/$u";; esac
            case "$u" in *jquery*|*bootstrap*|*google*) continue;; esac
            curl -sSL -A "$UA" "$u" -o "s$i.js" || true; echo "s$i.js $u" >> fetched.txt; done < scripts.txt
          grep -ohE '["'"'"'][^"'"'"' ]*(api|Api|json|Json|track|Track|position|Position|gpx|kml|Data|data)[^"'"'"' ]*["'"'"']' page.html s*.js 2>/dev/null | sort -u | head -400 > urls.txt || true
          ls -la
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "Probe MAProgress output" && git push || true
