name: Find landing beaches (OpenStreetMap + satellite sheets)

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_landings.py"
      - ".github/workflows/landings.yml"

permissions:
  contents: write

concurrency:
  group: landings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/fetch_landings.py
      - name: Commit landings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A data/landings.json data/landings
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update landing candidates"
          git pull --rebase
          git push
