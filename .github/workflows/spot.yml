name: Fetch 2015 SPOT tracks

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_spot.py"
      - "data/tracks/spot2015-teams.json"
      - ".github/workflows/spot.yml"

permissions:
  contents: write

concurrency:
  group: spot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python --version
      - run: python scripts/fetch_spot.py
      - name: Commit updated tracks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/tracks/r2ak2015-spot.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update 2015 SPOT tracks"
          git pull --rebase
          git push
