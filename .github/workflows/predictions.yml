name: Fetch tide and current predictions

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_predictions.py"
      - "data/stations.json"
      - ".github/workflows/predictions.yml"

permissions:
  contents: write

concurrency:
  group: predictions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy utide
      - run: python scripts/fetch_predictions.py
      - name: Commit updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update tide and current predictions"
          git pull --rebase
          git push
