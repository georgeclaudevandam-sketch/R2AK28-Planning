name: Fetch navigation lights (OpenSeaMap)

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_lights.py"
      - ".github/workflows/lights.yml"

permissions:
  contents: write

concurrency:
  group: lights-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_lights.py
      - name: Commit lights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/lights.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update navigation lights"
          git pull --rebase
          git push
