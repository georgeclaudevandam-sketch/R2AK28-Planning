#----------------------------------------------------------------------
# Properties file for WebTide linux
#----------------------------------------------------------------------
# ###################################################
# How to launch a browser to display additional information.
openmap.WebBrowser=/usr/bin/firefox --no-remote
# Help web pages
openmap.HelpURL=Docs/WebTideHelp.html

# Use internal frames as an application - used to be gui.UseInternalFrames
# Pop up frame is within the map fram if it is set to be true
openmap.UseInternalFrames=false

#Some Default values
Mesh=nwatl
DocDirName=Docs/
DataDirName=data/

# Width and Height of map, in pixels
openmap.Width=775
openmap.Height=605

# pixel X/Y window position (if values < 0, then center window on screen)
openmap.x=-1
openmap.y=-1

# The background color of the map, in hex AARRGGBB values (AA is
# transparancy, RR, GG and BB are red, green and blue in hex values
# between 00-FF (0-255)).
openmap.BackgroundColor=FFFFFFFF

# Here is a property that lets you add debug statements to the
# application, to get more informative printouts detailing what is
# going on in the application.  Each source file may Debug statements
# throughout it (Debug.debugging("keyword") or
# Debug.message("keyword", "statement")), and you can turn those
# statements on by adding those keywords to this list.  Follows the
# marker name paradigm, with space-separated names.
#openmap.Debug=properties basic contour graticule propertiesdetail \
#componentfactory drogue mapbean

#######################################
# components to load and show on the map
openmap.components=informationDelegator frame layerHandler projFactoryLoader projectionstack \
mouseDelegator selectMouseMode navMouseMode navMouseMode2 distanceMouseMode \
menuBar fileMenu controlMenu navigateMenu meshMenu layersMenu \
webTideMenu \
helpMenu helpUserMenuItem \
toolBar omToolSet mouseModePanel projectionstacktool dfopanel choosePanel 

frame.class=org.dfo.webtide.gui.MyMapFrame
layerHandler.class=com.bbn.openmap.LayerHandler
informationDelegator.class=com.bbn.openmap.InformationDelegator
projectionstack.class=com.bbn.openmap.proj.ProjectionStack

mouseDelegator.class=com.bbn.openmap.MouseDelegator
selectMouseMode.class=com.bbn.openmap.event.SelectMouseMode
navMouseMode.class=com.bbn.openmap.event.NavMouseMode
navMouseMode2.class=org.dfo.webtide.gui.MyNavMouseMode2
distanceMouseMode.class=com.bbn.openmap.event.DistanceMouseMode
distanceMouseMode.units=km

menuBar.class=com.bbn.openmap.gui.MenuBar
fileMenu.class=org.dfo.webtide.gui.MyFileMenu
controlMenu.class=org.dfo.webtide.gui.MyControlMenu
navigateMenu.class=org.dfo.webtide.gui.MyNavigateMenu
meshMenu.class=org.dfo.webtide.gui.MeshMenu
layersMenu.class=com.bbn.openmap.gui.LayersMenu
webTideMenu.class=org.dfo.webtide.gui.WebTideMenu
helpMenu.class=com.bbn.openmap.gui.DefaultHelpMenu
helpUserMenuItem.class=org.dfo.webtide.gui.MyUserGuideMenuItems

toolBar.class=com.bbn.openmap.gui.ToolPanel
omToolSet.class=com.bbn.openmap.gui.OMToolSet
omToolSet.addScale=false
mouseModePanel.class=org.dfo.webtide.gui.MyMouseModePanel
projectionstacktool.class=org.dfo.webtide.gui.MyProjectionStackTool
dfopanel.class=org.dfo.webtide.gui.DFOPanel
choosePanel.class=org.dfo.webtide.gui.ChoosePredictionPanel

projFactoryLoader.class=com.bbn.openmap.proj.ProjectionFactoryLoader
projFactoryLoader.projectionLoaders=mercatorloader cadrgloader ortholoader llxyloader gnomonicloader
projFactoryLoader.mercatorloader.class=com.bbn.openmap.proj.MercatorLoader
projFactoryLoader.cadrgloader.class=com.bbn.openmap.proj.CADRGLoader
projFactoryLoader.ortholoader.class=com.bbn.openmap.proj.OrthographicLoader
projFactoryLoader.llxyloader.class=com.bbn.openmap.proj.LLXYLoader
projFactoryLoader.gnomonicloader.class=com.bbn.openmap.proj.GnomonicLoader

#######################################
# layers to load and show on the map
openmap.layers=legend tidemarker graticule contour political

# These layers are turned on when the map is first started.  Order
# does not matter here...
openmap.startUpLayers=graticule contour tidemarker legend

graticule.class=com.bbn.openmap.layer.GraticuleLayer
graticule.prettyName=Graticule
graticule.showRuler=true
graticule.show1And5Lines=true
graticule.threshold=2

political.class=com.bbn.openmap.layer.shape.ShapeLayer
political.prettyName=Crude Map of the World
political.shapeFile=dcwpo-browse.shp
political.spatialIndex=dcwpo-browse.ssx
political.lineColor=ff000000
political.fillColor=ffbdde83

contour.class=org.dfo.webtide.gui.ContourLayer
contour.prettyName=Bathymetry Contours
contour.interiorColor=22ffffff

tidemarker.class=org.dfo.webtide.gui.TideMarkerLayer
tidemarker.prettyName=TideMarker

legend.class=org.dfo.webtide.gui.LegendLayer
legend.prettyName=Depth Legend
#----------------------------------------------------------------------
# End of properties file for WebTide
#----------------------------------------------------------------------
